name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - "packages/server/**"
      - "packages/common/**"
      - "docker-compose.yml"
      - "Dockerfile"

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: cd ~/shared-things && git pull && docker compose up -d --build
